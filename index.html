<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cartão Fidelidade - A.S Gourmet</title>
    <style>
        :root {
            --bg-color: #0b0b0b;
            --card-bg: #141414;
            --pink-main: #e29fb0;
            --pink-dark: #c58293;
            --text-white: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-white);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px 10px;
        }

        .card {
            background: var(--card-bg);
            border: 2px solid var(--pink-main);
            border-radius: 20px;
            padding: 30px 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0px 10px 25px rgba(226, 159, 176, 0.1);
        }

        .logo-area h1 {
            font-family: 'Georgia', serif;
            font-size: 32px;
            color: var(--pink-main);
            letter-spacing: 2px;
            font-style: italic;
        }

        .logo-area p {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #aaa;
            margin-top: 5px;
        }

        .slogan {
            font-size: 13px;
            color: #ccc;
            margin: 20px 0;
            line-height: 1.4;
            font-style: italic;
        }

        .grid-selos {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin: 25px 0;
            flex-wrap: wrap;
        }

        .selo {
            width: 55px;
            height: 55px;
            border: 2px dashed #333;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            background: #1a1a1a;
            transition: all 0.4s ease;
        }

        .selo.ativo {
            border-style: solid;
            border-color: var(--pink-main);
            background: rgba(226, 159, 176, 0.1);
            animation: pop 0.3s ease-in-out;
        }

        @keyframes pop {
            0% { transform: scale(0.8); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .btn-ganhar {
            background: transparent;
            border: 1px solid var(--pink-main);
            color: var(--pink-main);
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-comprar {
            display: inline-block;
            width: 100%;
            background: var(--pink-main);
            color: #121212;
            padding: 15px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 15px;
            text-decoration: none;
            margin-top: 25px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: background 0.3s;
        }

        .btn-comprar:hover {
            background: var(--pink-dark);
        }

        .regras {
            font-size: 11px;
            color: #666;
            margin-top: 20px;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="logo-area">
            <h1>A.S Gourmet</h1>
            <p>Cartão Fidelidade</p>
        </div>

        <p class="slogan">
            "Assim como um anagrama transforma letras em algo novo, eu transformo a sua pele em arte... e o seu dia em doçura." ᯓ★
        </p>

        <div class="grid-selos">
            <div class="selo" id="selo-1">🖤</div>
            <div class="selo" id="selo-2">🖤</div>
            <div class="selo" id="selo-3">🖤</div>
            <div class="selo" id="selo-4">🖤</div>
            <div class="selo" id="selo-5">🖤</div>
        </div>

        <button class="btn-ganhar" onclick="validarCodigo()">Validar Código Secreto</button>

        <a href="https://aesgourmet01.my.canva.site/" class="btn-comprar" target="_blank">
            Faça seu próximo pedido aqui! 🛍️
        </a>

        <div class="regras">
            A cada pedido ganhe 1 selo.<br>
            Completando os 5 selos, ganhe um benefício exclusivo!
        </div>
    </div>

    <script>
        // Códigos secretos que você pode dar para as clientes pontuarem
        const codigosValidos = {
            "DOCE10": 1,
            "AMOR02": 2,
            "VALE03": 3,
            "BRINDE04": 4,
            "FIM05": 5
        };

        function atualizarVisualCartao() {
            let progressoAtual = parseInt(localStorage.getItem('as_gourmet_selos')) || 0;
            
            for (let i = 1; i <= 5; i++) {
                const elementoSelo = document.getElementById(`selo-${i}`);
                if (i <= progressoAtual) {
                    elementoSelo.innerText = "💖";
                    elementoSelo.classList.add('ativo');
                } else {
                    elementoSelo.innerText = "🖤";
                    elementoSelo.classList.remove('ativo');
                }
            }

            if (progressoAtual >= 5) {
                setTimeout(() => {
                    alert("🎉 PARABÉNS! Você completou seu cartão fidelidade! Print essa tela e envie para a A.S Gourmet para resgatar seu prêmio! 🎁");
                }, 500);
            }
        }

        function validarCodigo() {
            let progressoAtual = parseInt(localStorage.getItem('as_gourmet_selos')) || 0;

            if (progressoAtual >= 5) {
                alert("Você já completou este cartão! Resgate seu prêmio com a loja. 🥰");
                return;
            }

            const codigoDigitado = prompt("Digite o código secreto enviado junto com seu pedido:").trim().toUpperCase();

            if (codigosValidos[codigoDigitado]) {
                let nivelDoCodigo = codigosValidos[codigoDigitado];

                if (nivelDoCodigo <= progressoAtual) {
                    alert("Esse código já foi utilizado ou você já passou dessa etapa! 😉");
                } else if (nivelDoCodigo === progressoAtual + 1) {
                    localStorage.setItem('as_gourmet_selos', nivelDoCodigo);
                    alert("✨ Selo validado com sucesso! Parabéns! ✨");
                    atualizarVisualCartao();
                } else {
                    alert("Ops! Você precisa validar os códigos na ordem certa dos seus pedidos. 😉");
                }
            } else {
                alert("Código inválido! Verifique se digitou certinho ou fale com a gente. ❌");
            }
        }

        window.onload = atualizarVisualCartao;
    </script>
</body>
</html>
